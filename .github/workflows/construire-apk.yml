name: OrChiD - compiler APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'orchid/**'
      - 'tests/**'
      - '.github/workflows/construire-apk.yml'

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler OrChiD 1.2.4 (APK debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-24.04 inclut le SDK et sdkmanager. Ne pas demander l'ancien paquet "tools".
      - name: Installer la plateforme Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager introuvable sur le runner Android."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Configurer Gradle 8.9 (compatible AGP 8.7.3)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Tests audio hors Android
        run: python3 tests/run_audio_tests.py

      - name: Compiler l'APK installable
        working-directory: orchid
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v5
        with:
          name: OrChiD-1.2.4-APK-debug
          path: orchid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
